# Turn recap — one card under a turn the session has gone quiet after, plus a
# `/recap` command that regenerates the latest turn's recap on demand.
#
# Every key below is optional; the row's `config` block overrides the defaults
# in index.js. Uncomment and edit a value to tune it:
#
#   enabled: true          # false leaves the row unregistered
#   maxTokens: 200         # output budget of the recap request
#   temperature: 0.2
#   timeoutMs: 12000       # hard bound on the recap request, in milliseconds
#   digestChars: 6000      # size bound of the turn digest sent to the model
#   idleMs: 120000         # quiet window before the card may appear; 0 = at once
#   skipSubagents: true    # subagent sessions get no recap card
#   provider: ...          # explicit route; defaults to the turn's own model
#   model: ...
- insert:
    - id: turn-recap
      name: '@local/dsh-turn-recap'
